root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/martgo-auth ./cmd/api"
  bin = "./tmp/martgo-auth"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[misc]
  clean_on_exit = true
