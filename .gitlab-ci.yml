stages:
  - test

variables:
  GOPATH: $CI_PROJECT_DIR/.go

cache:
  key:
    files: [go.sum]
  paths:
    - .go/pkg/mod/

.on-main-and-mr: &on-main-and-mr
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: golang:1.27
  <<: *on-main-and-mr
  script:
    - |
      unformatted=$(gofmt -l $(git ls-files '*.go'))
      if [ -n "$unformatted" ]; then
        echo "These files need gofmt:"
        echo "$unformatted"
        exit 1
      fi
    - go vet ./...
    - go build ./...
    - go test -race -count=1 ./...
    - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

# Generated code and the API spec must match what is committed.
sqlc-check:
  stage: test
  image: golang:1.27
  <<: *on-main-and-mr
  script:
    - make sqlc-check

lint-api:
  stage: test
  image: node:22
  <<: *on-main-and-mr
  cache: []
  script:
    - make lint-api
