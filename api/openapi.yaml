openapi: 3.1.0
info:
  title: martgo auth API
  version: 1.0.0
  description: |
    Login and staff user management for martgo. The access token returned by
    `POST /auth/login` is also accepted by mart-api (catalog, stock, sales, purchases).

    **Login with Google:** open `/api/v1/auth/google/login` in a new tab, then send
    the `code` you are redirected with to `POST /auth/google/exchange`.

    **Auth:** call `POST /auth/login`, then click **Authorize** and paste the
    `access_token`. Roles: `admin`, `manager`, `cashier`.

    **Errors** always have the shape `{"error": "message"}`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Log in, log out and inspect the current user.
  - name: Users
    description: Admin only.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and get an access token
      description: |
        Rate limited to 5 requests per minute per client IP. An email is locked
        for 15 minutes after 5 failed attempts (wrong passwords and wrong SMS codes).

        Users with a phone get `202` instead of a token: a 6-digit code is sent
        by SMS, and the login finishes with `POST /auth/login/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: admin@martgo.local, password: admin12345 }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "202":
          description: Password accepted, SMS code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OTPChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login/verify:
    post:
      tags: [Auth]
      operationId: verifyLoginCode
      summary: Finish a login with the SMS code
      description: |
        A code works once and expires after 5 minutes. After 5 wrong codes the
        challenge is dropped and the user must log in again. Rate limited to
        10 requests per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyOTPRequest" }
            example:
              { challenge_id: 24MTBK7CN26AQFLWQHGFAWEUYG, code: "395888" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong, expired or already used code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invalid or expired code }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login/resend:
    post:
      tags: [Auth]
      operationId: resendLoginCode
      summary: Send a new SMS code
      description: |
        Replaces the code and restarts its 5 minute lifetime. Allowed once
        `resend_at` has passed, at most 3 SMS per login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendOTPRequest" }
      responses:
        "202":
          description: New code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OTPChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The challenge expired or was used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "code expired, please log in again" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/google/login:
    get:
      tags: [Auth]
      operationId: googleLogin
      summary: Start "Login with Google" (open in a browser tab)
      description: |
        **Do not use "Try it out" here.** Open
        [/api/v1/auth/google/login](/api/v1/auth/google/login) in a new browser tab.
        Swagger UI calls the API with fetch, which cannot follow a redirect to Google.

        Sets the `martgo_oauth_state` cookie and redirects to Google. After the user
        signs in, Google sends the browser to `/auth/google/callback`, which redirects
        to `OAUTH_FRONTEND_URL` with `?code=` (trade it within 60 seconds with
        `POST /auth/google/exchange`) or `?error=`.

        Only staff that an admin already created can log in: the Google account must
        have a verified email equal to the user's email, or be linked to the user.
        Only available when `GOOGLE_CLIENT_ID` is set. Rate limited to 10 requests per
        minute per client IP.
      security: []
      responses:
        "302":
          description: Redirect to Google's sign-in page
          headers:
            Location: { schema: { type: string, format: uri } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: googleCallback
      summary: Google redirects the browser here (not called directly)
      description: |
        Checks the state against the `martgo_oauth_state` cookie, exchanges the code
        with Google and verifies the ID token. Always redirects to `OAUTH_FRONTEND_URL`.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - name: error
          in: query
          description: Set by Google when the user cancels
          schema: { type: string }
      responses:
        "302":
          description: |
            Redirect to `OAUTH_FRONTEND_URL?code=<one-time code>`, or to
            `OAUTH_FRONTEND_URL?error=<reason>` where reason is `access_denied`
            (cancelled at Google), `invalid_state`, `not_allowed` (no active MartGo
            user for this Google account) or `failed`.
          headers:
            Location: { schema: { type: string, format: uri } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google/exchange:
    post:
      tags: [Auth]
      operationId: googleExchange
      summary: Trade the one-time code from the Google login for a token
      description: |
        The code works once and expires after 60 seconds. Answers like
        `POST /auth/login`: users with a phone get `202` and finish with
        `POST /auth/login/verify`. Rate limited to 10 requests per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleExchangeRequest" }
            example: { code: 7NQ2ZK4XWJ3M5PRT6YV8B2CDFG }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "202":
          description: Google account accepted, SMS code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OTPChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unknown, used or expired code, or the user was disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "login link expired, please sign in again" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out on all devices
      description: Revokes every access token the current user holds, in this service and in mart-api.
      responses:
        "204":
          description: Logged out
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            example:
              email: cashier1@martgo.local
              password: cashier123
              full_name: Cashier One
              role: cashier
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user (only the fields sent are changed)
      description: |
        Admins cannot deactivate themselves or change their own role.
        Changing the password or deactivating the user revokes all their tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "email must be a valid email address" }
    Unauthorized:
      description: Missing, invalid, expired or revoked token, or wrong login
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid email or password }
    Forbidden:
      description: The user's role is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: you do not have permission to access this resource }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: user not found }
    Conflict:
      description: Duplicate value
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: user already exists }
    TooManyRequests:
      description: Rate limit or login lockout hit
      headers:
        Retry-After:
          description: Seconds to wait (rate limit only)
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            { error: "too many failed login attempts, please try again later" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Pagination:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    Role:
      type: string
      enum: [admin, manager, cashier]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 72 }

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    OTPChallenge:
      type: object
      properties:
        otp_required: { type: boolean, example: true }
        challenge_id: { type: string }
        phone_hint:
          { type: string, example: "******1234", description: Only on login }
        expires_at: { type: string, format: date-time }
        resend_at: { type: string, format: date-time }

    VerifyOTPRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 64 }
        code: { type: string, pattern: "^[0-9]{6}$" }

    ResendOTPRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id: { type: string, maxLength: 64 }

    GoogleExchangeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 64 }

    Phone:
      type: string
      maxLength: 20
      description: |
        Lao mobile number, e.g. `020 5555 1234`, `+856 20 5555 1234` or `030 555 1234`.
        Stored as `2055551234`. A user with a phone must confirm each login with an SMS code.

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        phone: { type: [string, "null"], example: "2055551234" }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    CreateUserRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
        full_name: { type: string, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        phone: { $ref: "#/components/schemas/Phone" }

    UpdateUserRequest:
      type: object
      description: Every field is optional; only the fields sent are changed.
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        password: { type: string, minLength: 8, maxLength: 72 }
        phone:
          description: Send `""` to remove the phone and turn SMS login codes off.
          allOf: [{ $ref: "#/components/schemas/Phone" }]
