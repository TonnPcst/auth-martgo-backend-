openapi: 3.1.0
info:
  title: martgo auth API
  version: 1.0.0
  description: |
    Login and staff user management for martgo. The access token returned by
    `POST /auth/login` is also accepted by mart-api (catalog, stock, sales, purchases).

    **Auth:** call `POST /auth/login`, then click **Authorize** and paste the
    `access_token`. Roles: `admin`, `manager`, `cashier`.

    **Errors** always have the shape `{"error": "message"}`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Log in, log out and inspect the current user.
  - name: Users
    description: Admin only.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and get an access token
      description: |
        Rate limited to 5 requests per minute per client IP. An email is locked
        for 15 minutes after 5 failed attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: admin@martgo.local, password: admin12345 }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out on all devices
      description: Revokes every access token the current user holds, in this service and in mart-api.
      responses:
        "204":
          description: Logged out
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            example:
              email: cashier1@martgo.local
              password: cashier123
              full_name: Cashier One
              role: cashier
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user (only the fields sent are changed)
      description: |
        Admins cannot deactivate themselves or change their own role.
        Changing the password or deactivating the user revokes all their tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "email must be a valid email address" }
    Unauthorized:
      description: Missing, invalid, expired or revoked token, or wrong login
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid email or password }
    Forbidden:
      description: The user's role is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: you do not have permission to access this resource }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: user not found }
    Conflict:
      description: Duplicate value
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: user already exists }
    TooManyRequests:
      description: Rate limit or login lockout hit
      headers:
        Retry-After:
          description: Seconds to wait (rate limit only)
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "too many failed login attempts, please try again later" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Pagination:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }

    Role:
      type: string
      enum: [admin, manager, cashier]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 72 }

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    CreateUserRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
        full_name: { type: string, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }

    UpdateUserRequest:
      type: object
      description: Every field is optional; only the fields sent are changed.
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        password: { type: string, minLength: 8, maxLength: 72 }
