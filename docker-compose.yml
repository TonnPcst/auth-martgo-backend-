services:
  postgres:
    image: postgres:17-alpine
    container_name: martgo-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-martgo_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-martgo_auth}
      POSTGRES_DB: ${POSTGRES_DB:-martgo_auth}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - authpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authpgdata:
